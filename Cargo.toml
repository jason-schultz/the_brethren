[package]
name = "false_colours"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
default-run = "false_colours"

[workspace]
# The game is the root package; `cargo run`, `test` and `build` mean it
# alone. `--workspace` takes in the tools too.
members = ["crates/chronicle", "tools/report"]

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
chronicle = { path = "crates/chronicle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
bevy = "0.20"
chronicle.workspace = true
earcut = "0.4"
ron = "0.12"
serde.workspace = true
serde_json.workspace = true

[features]
# Faster incremental builds during development: `cargo run --features dev`.
# Never ship with this enabled.
dev = ["bevy/dynamic_linking", "chronicle"]
# The full chronicle of a run, for playtests and soaks: a log of battles,
# news, standing, money, and a snapshot a day, a note key, and alarms.
# Without it, a build keeps only the little a crash report needs.
chronicle = []

# The world running on its own, headless: `cargo soak`.
[[bin]]
name = "soak"
required-features = ["chronicle"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Bevy systems routinely take many params and complex query types.
too_many_arguments = "allow"
type_complexity = "allow"

[lints]
workspace = true

# Optimize our code a little in dev, and dependencies (Bevy) fully.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
